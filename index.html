<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS_GEMINI_FINAL_FIX</title>
    <style>
        :root { --bg: #050505; --gemini: #4285f4; --hacker: #39ff14; --border: #30363d; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: monospace; display: flex; height: 100vh; }
        #sidebar { width: 250px; background: #0d1117; border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 15px; }
        #main { flex: 1; display: flex; flex-direction: column; }
        header { height: 50px; background: #161b22; display: flex; align-items: center; padding: 0 20px; border-bottom: 1px solid var(--border); justify-content: space-between; }
        .tab-bar { display: flex; background: #000; gap: 10px; padding: 5px 20px; border-bottom: 1px solid var(--border); }
        .tab { cursor: pointer; color: #555; font-size: 12px; }
        .tab.active { color: var(--hacker); border-bottom: 1px solid var(--hacker); }
        .viewer { flex: 1; position: relative; }
        #codeOut { width: 100%; height: 100%; background: #010409; color: #7ee787; padding: 20px; border: none; font-size: 14px; outline: none; resize: none; display: block; }
        #liveOut { width: 100%; height: 100%; background: #fff; border: none; display: none; }
        .input-box { height: 120px; background: #161b22; display: flex; padding: 15px; gap: 10px; border-top: 1px solid var(--border); }
        textarea { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; padding: 10px; outline: none; }
        .btn { background: var(--gemini); color: #fff; border: none; padding: 0 20px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div id="sidebar">
        <b style="color:var(--gemini)">MS STUDIO V11</b>
        <div style="margin-top:20px; font-size:10px; color:#555;">API KEY MANAGER</div>
        <input type="password" id="gKey" placeholder="Paste Gemini Key" style="width:100%; background:#000; border:1px solid #333; color:#fff; padding:5px; margin-top:5px;">
        <button onclick="saveKey()" style="width:100%; margin-top:5px; font-size:10px; cursor:pointer;">SAVE KEY</button>
        <div id="fileList" style="margin-top:20px;"></div>
    </div>
    <div id="main">
        <header>
            <div id="status" style="font-size:10px; color:var(--hacker)">[ STATUS: WAITING ]</div>
            <div style="font-size:10px; color:#555">GOOGLE_AI_FIXED</div>
        </header>
        <div class="tab-bar">
            <div class="tab active" id="t-code" onclick="switchV('code')">SOURCE_CODE</div>
            <div class="tab" id="t-live" onclick="switchV('live')">LIVE_VIEW</div>
        </div>
        <div class="viewer">
            <textarea id="codeOut" readonly></textarea>
            <iframe id="liveOut"></iframe>
        </div>
        <div class="input-box">
            <textarea id="prompt" placeholder="Kaisa app chahiye? Type karein..."></textarea>
            <button class="btn" onclick="build()">GENERATE</button>
        </div>
    </div>

    <script>
        function saveKey() { localStorage.setItem('ms_g_v11', document.getElementById('gKey').value); alert("Key Saved!"); }
        function switchV(m) {
            document.getElementById('codeOut').style.display = m === 'code' ? 'block' : 'none';
            document.getElementById('liveOut').style.display = m === 'live' ? 'block' : 'none';
            document.getElementById('t-code').classList.toggle('active', m === 'code');
            document.getElementById('t-live').classList.toggle('active', m === 'live');
        }

        async function build() {
            const p = document.getElementById('prompt').value;
            const k = localStorage.getItem('ms_g_v11');
            const st = document.getElementById('status');
            if(!k) return alert("Pehle API Key dalo!");

            st.innerText = "[ STATUS: PROCESSING... ]";
            try {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${k}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: p + " . Response format: Strictly ONLY the HTML/CSS/JS code, no markdown, no talk." }] }] })
                });

                const data = await res.json();
                
                // If Google returns error (like your screenshot)
                if(data.error) {
                    throw new Error(data.error.message);
                }

                let code = data.candidates[0].content.parts[0].text.replace(/```html|```/gi, "").trim();
                document.getElementById('codeOut').value = code;
                const blob = new Blob([code], { type: 'text/html' });
                document.getElementById('liveOut').src = URL.createObjectURL(blob);
                switchV('code');
            } catch (err) {
                alert("API Error: " + err.message);
                console.error(err);
            } finally {
                st.innerText = "[ STATUS: READY ]";
            }
        }

        window.onload = () => { if(localStorage.getItem('ms_g_v11')) document.getElementById('gKey').value = localStorage.getItem('ms_g_v11'); };
    </script>
</body>
</html>
