<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS ULTIMATE AI STUDIO</title>
    <style>
        :root {
            --bg-black: #050505;
            --side-panel: #0d1117;
            --hacker-green: #39ff14;
            --gemini-blue: #4285f4;
            --claude-orange: #d97757;
            --open-purple: #a855f7;
            --border: #30363d;
        }

        body {
            margin: 0; background: var(--bg-black); color: #e6edf3;
            font-family: 'Consolas', 'Courier New', monospace;
            display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar */
        #sidebar {
            width: 260px; background: var(--side-panel); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; z-index: 10;
        }

        .engine-card {
            padding: 15px; border-bottom: 1px solid var(--border);
            cursor: pointer; font-size: 11px; transition: 0.3s; opacity: 0.6;
        }
        .engine-card.active { opacity: 1; background: rgba(255,255,255,0.05); }
        .engine-card[data-type="claude"].active { border-left: 4px solid var(--claude-orange); }
        .engine-card[data-type="gemini"].active { border-left: 4px solid var(--gemini-blue); }
        .engine-card[data-type="openrouter"].active { border-left: 4px solid var(--open-purple); }

        .file-explorer { flex: 1; overflow-y: auto; padding: 10px; }
        .file-link {
            padding: 8px; margin-bottom: 5px; border-radius: 4px; cursor: pointer;
            font-size: 12px; display: flex; align-items: center; gap: 8px;
        }
        .file-link:hover { background: #21262d; }

        /* Main Center Workspace */
        #workspace { flex: 1; display: flex; flex-direction: column; background: #000; }

        header {
            height: 50px; background: #161b22; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }

        .active-badge {
            padding: 2px 10px; border-radius: 10px; font-size: 10px; font-weight: bold;
            text-transform: uppercase; border: 1px solid;
        }

        .editor-container { flex: 1; display: flex; flex-direction: column; position: relative; }
        
        /* View Modes */
        .mode-tabs { display: flex; background: #0d1117; padding: 5px 20px; gap: 15px; border-bottom: 1px solid var(--border); }
        .tab-btn { cursor: pointer; font-size: 12px; color: #8b949e; padding: 5px 10px; }
        .tab-btn.active { color: var(--hacker-green); border-bottom: 2px solid var(--hacker-green); }

        #codeViewer {
            flex: 1; width: 100%; background: #010409; color: #7ee787;
            border: none; padding: 20px; font-family: inherit; font-size: 14px; outline: none;
            resize: none; display: block;
        }

        #liveViewer { flex: 1; width: 100%; height: 100%; background: white; border: none; display: none; }

        /* Input Panel */
        .bottom-input {
            height: 120px; background: #161b22; border-top: 1px solid var(--border);
            padding: 15px; display: flex; gap: 15px;
        }
        textarea#promptArea {
            flex: 1; background: #000; border: 1px solid var(--border); color: #fff;
            border-radius: 8px; padding: 10px; outline: none; resize: none;
        }
        .btn-send {
            width: 120px; background: var(--hacker-green); color: #000; font-weight: bold;
            border: none; border-radius: 8px; cursor: pointer;
        }

        /* Settings */
        .key-input { padding: 10px; background: #000; border-top: 1px solid var(--border); }
        .key-input input { width: 100%; background: #111; border: 1px solid #333; color: #fff; font-size: 10px; padding: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div style="padding: 20px; font-weight: bold; color: var(--hacker-green); border-bottom: 1px solid var(--border);">
            MS_STUDIO_V9
        </div>
        
        <div class="engine-card active" data-type="claude" onclick="setEngine('claude')">
            <b>CLAUDE 3.5 SONNET</b><br><span style="color:#555">High-Speed Coding</span>
        </div>
        <div class="engine-card" data-type="gemini" onclick="setEngine('gemini')">
            <b>GOOGLE GEMINI PRO</b><br><span style="color:#555">Large Context Engine</span>
        </div>
        <div class="engine-card" data-type="openrouter" onclick="setEngine('openrouter')">
            <b>OPENROUTER AI</b><br><span style="color:#555">Multi-Model Access</span>
        </div>

        <div class="file-explorer" id="fileList">
            <div style="font-size: 10px; color: #444; margin-bottom: 10px;">GENERATED MODULES</div>
            </div>

        <div class="key-input">
            <input type="password" id="keyVal" placeholder="API Key for active engine">
            <button onclick="saveKey()" style="width:100%; margin-top:5px; font-size:9px; cursor:pointer;">LOCK KEY</button>
        </div>
    </div>

    <div id="workspace">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <span id="engineLabel" class="active-badge" style="color:var(--claude-orange); border-color:var(--claude-orange)">CLAUDE ACTIVE</span>
                <span id="status" style="font-size: 10px; color: #555;">IDLE</span>
            </div>
            <div style="font-size: 12px; color: var(--hacker-green);">LIVE_SYSTEM_SYNC: OK</div>
        </header>

        <div class="mode-tabs">
            <div class="tab-btn active" id="codeTab" onclick="viewMode('code')">VIEW_CODE</div>
            <div class="tab-btn" id="liveTab" onclick="viewMode('live')">LIVE_VIEW</div>
        </div>

        <div class="editor-container">
            <textarea id="codeViewer" readonly placeholder="// Coding yahan dikhegi..."></textarea>
            <iframe id="liveViewer"></iframe>
        </div>

        <div class="bottom-input">
            <textarea id="promptArea" placeholder="Aapko kaisa app banwana hai? Type karein..."></textarea>
            <button class="btn-send" onclick="generate()">GENERATE</button>
        </div>
    </div>

    <script>
        let currentEngine = 'claude';
        let files = [];
        const PROXY = "https://api.allorigins.win/raw?url=";

        function setEngine(e) {
            currentEngine = e;
            document.querySelectorAll('.engine-card').forEach(c => c.classList.remove('active'));
            document.querySelector(`.engine-card[data-type="${e}"]`).classList.add('active');
            
            const label = document.getElementById('engineLabel');
            label.innerText = `${e.toUpperCase()} ACTIVE`;
            if(e === 'claude') label.style.color = label.style.borderColor = "var(--claude-orange)";
            if(e === 'gemini') label.style.color = label.style.borderColor = "var(--gemini-blue)";
            if(e === 'openrouter') label.style.color = label.style.borderColor = "var(--open-purple)";
            
            document.getElementById('keyVal').value = localStorage.getItem('key_' + e) || '';
        }

        function saveKey() {
            localStorage.setItem('key_' + currentEngine, document.getElementById('keyVal').value);
            alert(currentEngine.toUpperCase() + " Key Saved!");
        }

        function viewMode(m) {
            document.getElementById('codeViewer').style.display = m === 'code' ? 'block' : 'none';
            document.getElementById('liveViewer').style.display = m === 'live' ? 'block' : 'none';
            document.getElementById('codeTab').classList.toggle('active', m === 'code');
            document.getElementById('liveTab').classList.toggle('active', m === 'live');
        }

        async function generate() {
            const prompt = document.getElementById('promptArea').value;
            const key = localStorage.getItem('key_' + currentEngine);
            if(!key) return alert("Pehle Key dalo bhai!");

            document.getElementById('status').innerText = "GENERATING_CODE...";
            
            try {
                let code = "";
                if(currentEngine === 'claude') code = await callClaude(prompt, key);
                if(currentEngine === 'gemini') code = await callGemini(prompt, key);
                if(currentEngine === 'openrouter') code = await callOpenRouter(prompt, key);

                document.getElementById('codeViewer').value = code;
                const blob = new Blob([code], { type: 'text/html' });
                document.getElementById('liveViewer').src = URL.createObjectURL(blob);
                
                // Add to list
                files.push({ name: `App_${currentEngine}_${files.length+1}.html`, code: code });
                updateFileList();
                viewMode('code'); // Pehle coding dikhao

            } catch (err) {
                alert("Error! Check API or Key.");
            } finally {
                document.getElementById('status').innerText = "IDLE";
            }
        }

        async function callClaude(p, k) {
            const res = await fetch(PROXY + encodeURIComponent("https://api.anthropic.com/v1/messages"), {
                method: 'POST',
                headers: { 'x-api-key': k, 'anthropic-version': '2023-06-01', 'content-type': 'application/json' },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20240620", max_tokens: 4000,
                    system: "Only output HTML/CSS/JS code.",
                    messages: [{ role: "user", content: p }]
                })
            });
            const d = await res.json(); return d.content[0].text;
        }

        async function callGemini(p, k) {
            const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-pro:generateContent?key=${k}`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ contents: [{ parts: [{ text: p + " (Output HTML/CSS/JS only)" }] }] })
            });
            const d = await res.json(); return d.candidates[0].content.parts[0].text.replace(/```html|```/g, '');
        }

        async function callOpenRouter(p, k) {
            const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: 'POST', headers: { 'Authorization': `Bearer ${k}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ model: "openai/gpt-4o", messages: [{ role: "user", content: p }] })
            });
            const d = await res.json(); return d.choices[0].message.content.replace(/```html|```/g, '');
        }

        function updateFileList() {
            const list = document.getElementById('fileList');
            list.innerHTML = '<div style="font-size: 10px; color: #444; margin-bottom: 10px;">GENERATED MODULES</div>';
            files.forEach(f => {
                const d = document.createElement('div');
                d.className = 'file-link';
                d.innerHTML = `📄 ${f.name}`;
                d.onclick = () => { document.getElementById('codeViewer').value = f.code; viewMode('code'); };
                list.prepend(d);
            });
        }

        window.onload = () => setEngine('claude');
    </script>
</body>
</html>
