<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS VIP CODE ENGINE</title>
    <style>
        :root {
            --neon-cyan: #00f2ff;
            --neon-green: #39ff14;
            --bg-black: #050505;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --border-color: #1f2937;
        }

        body {
            margin: 0; background: var(--bg-black); color: #fff;
            font-family: 'Courier New', Courier, monospace; display: flex; height: 100vh;
        }

        /* Sidebar - File Explorer */
        #sidebar {
            width: 280px; background: #0a0a0a; border-right: 2px solid var(--neon-cyan);
            display: flex; flex-direction: column; transition: 0.4s;
        }

        .explorer-header {
            padding: 20px; font-weight: bold; font-size: 14px; color: var(--neon-cyan);
            border-bottom: 1px solid var(--border-color); text-transform: uppercase;
        }

        .file-explorer { flex: 1; overflow-y: auto; padding: 10px; }
        .file-item {
            padding: 10px 15px; margin-bottom: 5px; background: var(--glass-bg);
            border: 1px solid transparent; border-radius: 4px; cursor: pointer;
            font-size: 13px; transition: 0.3s;
        }
        .file-item:hover { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 10px rgba(57, 255, 20, 0.2); }

        /* Main Workspace */
        #main-view { flex: 1; display: flex; flex-direction: column; }

        header {
            height: 60px; background: #000; border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; padding: 0 25px; justify-content: space-between;
        }

        .status-dot { height: 10px; width: 10px; background: var(--neon-green); border-radius: 50%; display: inline-block; box-shadow: 0 0 8px var(--neon-green); }

        .editor-zone { flex: 1; display: flex; flex-direction: column; padding: 20px; gap: 15px; }

        textarea {
            flex: 1; background: #0d0d0d; color: var(--neon-green); border: 1px solid var(--neon-cyan);
            border-radius: 10px; padding: 20px; font-size: 16px; outline: none; resize: none;
            box-shadow: inset 0 0 15px rgba(0, 242, 255, 0.05);
        }

        .action-bar { display: flex; gap: 10px; }
        .btn-exec {
            flex: 1; background: transparent; color: var(--neon-cyan); border: 1px solid var(--neon-cyan);
            padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 2px; transition: 0.3s;
        }
        .btn-exec:hover { background: var(--neon-cyan); color: #000; box-shadow: 0 0 20px var(--neon-cyan); }

        /* Preview Overlay */
        #live-frame-container {
            position: absolute; top: 60px; left: 0; right: 0; bottom: 0;
            background: #fff; display: none; z-index: 100;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .close-preview {
            position: absolute; top: 10px; right: 20px; background: #ff3131;
            color: #fff; padding: 5px 15px; border-radius: 5px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="explorer-header">📂 Project Files</div>
        <div class="file-explorer" id="files">
            </div>
        <div style="padding:15px; font-size: 10px; color: #444; border-top: 1px solid #111;">
            API STATUS: <span style="color:var(--neon-green)">READY</span>
        </div>
    </div>

    <div id="main-view">
        <header>
            <div style="font-weight: bold; letter-spacing: 1px;">
                <span class="status-dot"></span> MS_CORE_ENGINE v5
            </div>
            <div id="file-name" style="color:var(--neon-cyan); font-size: 12px;">new_script.bin</div>
        </header>

        <div class="editor-zone">
            <textarea id="prompt" placeholder="> Yahan apna prompt likhein... (E.g. Build a premium gaming login page with 3D effects)"></textarea>
            <div class="action-bar">
                <button class="btn-exec" onclick="startGeneration()">Execute Generation Protocol</button>
            </div>
        </div>

        <div id="live-frame-container">
            <div class="close-preview" onclick="closePreview()">CLOSE PREVIEW [X]</div>
            <iframe id="output"></iframe>
        </div>
    </div>

    <script>
        let projects = JSON.parse(localStorage.getItem('ms_hacker_files') || '[]');
        const MY_KEY = "sk-eMZ0YbZjMnDJCw8kbfx1jZTVKKSImuqWvoDphfogrLuWPtys";

        function closePreview() {
            document.getElementById('live-frame-container').style.display = 'none';
        }

        async function startGeneration() {
            const promptText = document.getElementById('prompt').value;
            if (!promptText) return alert("Prompt empty!");

            const btn = document.querySelector('.btn-exec');
            btn.innerText = "DECRYPTING RESPONSE...";
            btn.disabled = true;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': MY_KEY,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'dangerously-allow-allowed-origins': 'true'
                    },
                    body: JSON.stringify({
                        model: "claude-3-5-sonnet-20240620",
                        max_tokens: 4000,
                        system: "You are a senior elite developer. Output ONLY high-quality, single-file HTML/CSS/JS code. Do not write any conversational text.",
                        messages: [{ role: "user", content: promptText }]
                    })
                });

                const data = await response.json();
                const aiCode = data.content[0].text;

                // Save to local storage system
                const newFile = {
                    id: Date.now(),
                    name: `Module_${projects.length + 1}.html`,
                    code: aiCode
                };
                projects.push(newFile);
                localStorage.setItem('ms_hacker_files', JSON.stringify(projects));

                renderExplorer();
                openInPreview(aiCode);

            } catch (err) {
                alert("PROTOCOL ERROR: Check Connection or API Quota.");
                console.error(err);
            } finally {
                btn.innerText = "Execute Generation Protocol";
                btn.disabled = false;
            }
        }

        function renderExplorer() {
            const list = document.getElementById('files');
            list.innerHTML = '';
            projects.forEach(p => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerText = `📄 ${p.name}`;
                item.onclick = () => openInPreview(p.code);
                list.prepend(item);
            });
        }

        function openInPreview(code) {
            const container = document.getElementById('live-frame-container');
            const frame = document.getElementById('output');
            container.style.display = 'block';
            const blob = new Blob([code], { type: 'text/html' });
            frame.src = URL.createObjectURL(blob);
        }

        window.onload = renderExplorer;
    </script>
</body>
</html>
