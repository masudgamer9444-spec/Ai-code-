<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS PRO BUILDER v4</title>
    <style>
        :root {
            --bg-body: #080a0f;
            --bg-side: #0f121a;
            --accent: #00f2ff;
            --text-main: #e6edf3;
            --border: #30363d;
        }

        body {
            margin: 0; background: var(--bg-body); color: var(--text-main);
            font-family: 'Consolas', monospace; display: flex; height: 100vh;
        }

        /* Sidebar - Files & Folders */
        #sidebar {
            width: 250px; background: var(--bg-side); border-right: 1px solid var(--border);
            display: flex; flex-direction: column; transition: 0.3s;
        }

        .side-title {
            padding: 15px; font-size: 12px; font-weight: bold; color: #8b949e;
            border-bottom: 1px solid var(--border); display: flex; justify-content: space-between;
        }

        .file-list { flex: 1; overflow-y: auto; padding: 10px; }
        .file-item {
            padding: 8px 12px; cursor: pointer; border-radius: 6px; font-size: 13px;
            margin-bottom: 4px; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .file-item:hover { background: #1c212c; color: var(--accent); }
        .file-item.active { background: #21262d; border-left: 3px solid var(--accent); }

        /* Main Workspace */
        #workspace { flex: 1; display: flex; flex-direction: column; position: relative; }

        header {
            height: 50px; background: var(--bg-side); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }

        .tabs { display: flex; gap: 20px; }
        .tab { cursor: pointer; font-size: 14px; padding: 5px 10px; border-radius: 4px; }
        .tab.active { background: var(--accent); color: #000; font-weight: bold; }

        .editor-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; }

        textarea {
            flex: 1; background: #010409; color: #7ee787; border: 1px solid var(--border);
            border-radius: 8px; padding: 20px; font-size: 14px; outline: none; resize: none;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }

        .btn-run {
            background: var(--accent); color: #000; border: none; padding: 12px;
            font-weight: bold; border-radius: 6px; cursor: pointer; text-transform: uppercase;
        }

        /* Preview Overlay */
        #preview-overlay {
            position: absolute; top: 50px; left: 0; right: 0; bottom: 0;
            background: white; display: none; z-index: 50;
        }
        iframe { width: 100%; height: 100%; border: none; }

        /* Settings Panel */
        .settings-btn { cursor: pointer; color: var(--accent); font-size: 18px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="side-title">EXPLORER <span onclick="clearStorage()" style="cursor:pointer;color:#f85149">Clear All</span></div>
        <div class="file-list" id="fileManager">
            </div>
        <div style="padding:15px; border-top:1px solid var(--border)">
            <input type="password" id="apiKey" placeholder="Claude API Key" 
                   style="width:100%; background:#000; border:1px solid var(--border); color:#fff; padding:5px; font-size:10px;">
            <button onclick="saveKey()" style="width:100%; margin-top:5px; font-size:10px; cursor:pointer;">SAVE KEY</button>
        </div>
    </div>

    <div id="workspace">
        <header>
            <div class="tabs">
                <div class="tab active" onclick="showEditor()">EDITOR</div>
                <div class="tab" id="runTab" onclick="showPreview()">LIVE PREVIEW</div>
            </div>
            <div class="settings-btn" onclick="alert('Masud AI Studio v4 Running...')">⚙</div>
        </header>

        <div class="editor-container" id="editorView">
            <textarea id="userPrompt" placeholder="> Type your prompt here (e.g., Build a premium Free Fire dashboard with neon effects)"></textarea>
            <button class="btn-run" onclick="generateCode()">Generate Code Protocol</button>
        </div>

        <div id="preview-overlay">
            <iframe id="outputFrame"></iframe>
        </div>
    </div>

    <script>
        let files = JSON.parse(localStorage.getItem('ms_files') || '[]');
        
        function saveKey() {
            const key = document.getElementById('apiKey').value;
            localStorage.setItem('ms_claude_key', key);
            alert("API Key Locked!");
        }

        function showEditor() {
            document.getElementById('editorView').style.display = 'flex';
            document.getElementById('preview-overlay').style.display = 'none';
            updateTabs(0);
        }

        function showPreview() {
            document.getElementById('editorView').style.display = 'none';
            document.getElementById('preview-overlay').style.display = 'block';
            updateTabs(1);
        }

        function updateTabs(idx) {
            const ts = document.querySelectorAll('.tab');
            ts.forEach(t => t.classList.remove('active'));
            ts[idx].classList.add('active');
        }

        async function generateCode() {
            const prompt = document.getElementById('userPrompt').value;
            const key = localStorage.getItem('ms_claude_key');
            if(!key) return alert("Pehle Sidebar mein API Key dalo bhai!");
            if(!prompt) return alert("Prompt toh likho!");

            const btn = document.querySelector('.btn-run');
            btn.innerText = "Processing Protocol...";
            btn.disabled = true;

            try {
                const response = await fetch('https://api.anthropic.com/v1/messages', {
                    method: 'POST',
                    headers: {
                        'x-api-key': key,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json',
                        'dangerously-allow-allowed-origins': 'true'
                    },
                    body: JSON.stringify({
                        model: "claude-3-5-sonnet-20240620",
                        max_tokens: 4000,
                        system: "You are a world-class web developer. Provide ONLY valid, single-file HTML code with internal CSS/JS. No explanations.",
                        messages: [{ role: "user", content: prompt }]
                    })
                });

                const data = await response.json();
                const code = data.content[0].text;

                // Create File Object
                const fileName = "app_" + (files.length + 1) + ".html";
                files.push({ name: fileName, code: code });
                localStorage.setItem('ms_files', JSON.stringify(files));

                renderFiles();
                loadCodeIntoPreview(code);
                showPreview();

            } catch (e) {
                alert("Error! Check API Key or Internet.");
            } finally {
                btn.innerText = "Generate Code Protocol";
                btn.disabled = false;
            }
        }

        function renderFiles() {
            const container = document.getElementById('fileManager');
            container.innerHTML = '';
            files.forEach((f, idx) => {
                const div = document.createElement('div');
                div.className = 'file-item';
                div.innerHTML = `📄 ${f.name}`;
                div.onclick = () => loadCodeIntoPreview(f.code);
                container.appendChild(div);
            });
        }

        function loadCodeIntoPreview(code) {
            const frame = document.getElementById('outputFrame');
            const blob = new Blob([code], { type: 'text/html' });
            frame.src = URL.createObjectURL(blob);
            showPreview();
        }

        function clearStorage() {
            if(confirm("Saari files delete kar dein?")) {
                localStorage.removeItem('ms_files');
                files = [];
                renderFiles();
            }
        }

        // Init
        window.onload = () => {
            renderFiles();
            const key = localStorage.getItem('ms_claude_key');
            if(key) document.getElementById('apiKey').value = key;
        }
    </script>
</body>
</html>
