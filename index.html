<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS HACKER STUDIO V13</title>
    <style>
        :root { --hacker: #39ff14; --bg: #050505; --panel: #0d1117; --border: #30363d; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Consolas', monospace; display: flex; height: 100vh; }
        #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .side-head { padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border); color: var(--hacker); }
        .file-list { flex: 1; overflow-y: auto; padding: 10px; }
        .file-box { padding: 10px; background: #161b22; margin-bottom: 5px; border-radius: 4px; cursor: pointer; font-size: 12px; border-left: 3px solid transparent; }
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        header { height: 50px; background: #000; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; justify-content: space-between; }
        .tabs { display: flex; background: #080a0f; border-bottom: 1px solid var(--border); }
        .tab-item { padding: 10px 20px; cursor: pointer; font-size: 12px; color: #555; }
        .tab-item.active { color: var(--hacker); border-bottom: 2px solid var(--hacker); }
        .content-view { flex: 1; position: relative; }
        #codeEditor { width: 100%; height: 100%; background: #010409; color: #7ee787; border: none; padding: 20px; font-size: 14px; outline: none; resize: none; display: block; }
        #liveFrame { width: 100%; height: 100%; background: #fff; border: none; display: none; }
        .input-panel { height: 130px; background: #161b22; border-top: 1px solid var(--border); padding: 15px; display: flex; gap: 15px; }
        textarea#prompt { flex: 1; background: #000; border: 1px solid var(--border); color: #fff; border-radius: 8px; padding: 10px; outline: none; resize: none; }
        .btn-build { width: 120px; background: var(--hacker); color: #000; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .key-settings { padding: 15px; background: #000; border-top: 1px solid var(--border); }
        input[type="password"] { width: 100%; background: #111; border: 1px solid #333; color: #fff; font-size: 10px; padding: 6px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="sidebar">
        <div class="side-head">MS STUDIO V13</div>
        <div class="file-list" id="files"></div>
        <div class="key-settings">
            <input type="password" id="apiKey" placeholder="Paste Gemini API Key">
            <button onclick="saveKey()" style="width:100%; margin-top:5px; font-size:9px; cursor:pointer; background:#00f2ff; border:none; padding:4px;">LOCK PROTOCOL</button>
        </div>
    </div>
    <div id="main">
        <header><div style="font-size: 10px; color: var(--hacker);">SYSTEM: ONLINE</div></header>
        <div class="tabs">
            <div class="tab-item active" id="tabCode" onclick="switchMode('code')">CODE</div>
            <div class="tab-item" id="tabLive" onclick="switchMode('live')">LIVE</div>
        </div>
        <div class="content-view">
            <textarea id="codeEditor" readonly placeholder="// Source code will appear here..."></textarea>
            <iframe id="liveFrame"></iframe>
        </div>
        <div class="input-panel">
            <textarea id="prompt" placeholder="Kaisa app banau?"></textarea>
            <button class="btn-build" onclick="startBuild()">EXECUTE</button>
        </div>
    </div>

    <script>
        function saveKey() { localStorage.setItem('ms_v13_key', document.getElementById('apiKey').value); alert("Key Saved!"); }
        function switchMode(m) {
            document.getElementById('codeEditor').style.display = m === 'code' ? 'block' : 'none';
            document.getElementById('liveFrame').style.display = m === 'live' ? 'block' : 'none';
            document.getElementById('tabCode').classList.toggle('active', m === 'code');
            document.getElementById('tabLive').classList.toggle('active', m === 'live');
        }

        async function startBuild() {
            const promptVal = document.getElementById('prompt').value;
            const key = localStorage.getItem('ms_v13_key');
            if(!key) return alert("API Key dalo!");

            const btn = document.querySelector('.btn-build');
            btn.innerText = "WAIT...";
            btn.disabled = true;

            try {
                // CHANGED: Using v1 instead of v1beta and stable model name
                const url = `https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${key}`;
                
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: promptVal + " . Respond ONLY with HTML code." }] }]
                    })
                });

                const data = await response.json();
                if(data.error) throw new Error(data.error.message);

                let code = data.candidates[0].content.parts[0].text.replace(/```html|```/gi, "").trim();
                document.getElementById('codeEditor').value = code;
                const blob = new Blob([code], { type: 'text/html' });
                document.getElementById('liveFrame').src = URL.createObjectURL(blob);
                switchMode('code');
            } catch (err) {
                alert("Protocol Error: " + err.message);
            } finally {
                btn.innerText = "EXECUTE";
                btn.disabled = false;
            }
        }

        window.onload = () => { if(localStorage.getItem('ms_v13_key')) document.getElementById('apiKey').value = localStorage.getItem('ms_v13_key'); }
    </script>
</body>
</html>
