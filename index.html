<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MS HACKER PRO v6</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap');
        
        :root {
            --hacker-green: #00ff41;
            --cyber-blue: #00f2ff;
            --dark-bg: #050505;
            --side-bg: #0a0a0a;
            --border: #1f2937;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0; background: var(--dark-bg); color: var(--hacker-green);
            font-family: 'Fira Code', monospace; display: flex; height: 100vh; overflow: hidden;
        }

        /* Sidebar - File System */
        #sidebar {
            width: 260px; background: var(--side-bg); border-right: 2px solid var(--hacker-green);
            display: flex; flex-direction: column; transition: 0.3s;
        }

        .sidebar-header {
            padding: 20px; font-weight: bold; border-bottom: 1px solid var(--border);
            text-align: center; letter-spacing: 2px; color: var(--cyber-blue);
        }

        .file-explorer { flex: 1; overflow-y: auto; padding: 10px; }
        .file-node {
            padding: 10px; margin-bottom: 5px; background: rgba(255,255,255,0.03);
            border: 1px solid transparent; cursor: pointer; border-radius: 4px; font-size: 12px;
        }
        .file-node:hover { border-color: var(--hacker-green); box-shadow: 0 0 10px rgba(0, 255, 65, 0.2); }

        /* Main Workspace */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }

        header {
            height: 55px; background: #000; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; padding: 0 20px; justify-content: space-between;
        }

        .editor-container { flex: 1; display: flex; flex-direction: column; padding: 15px; gap: 15px; }

        textarea {
            flex: 1; background: #000; color: #fff; border: 1px solid var(--hacker-green);
            padding: 15px; border-radius: 8px; font-family: inherit; outline: none; resize: none;
            box-shadow: inset 0 0 15px rgba(0, 255, 65, 0.05);
        }

        .btn-execute {
            background: transparent; color: var(--hacker-green); border: 2px solid var(--hacker-green);
            padding: 15px; font-weight: bold; border-radius: 5px; cursor: pointer;
            text-transform: uppercase; transition: 0.3s;
        }
        .btn-execute:hover { background: var(--hacker-green); color: #000; box-shadow: 0 0 20px var(--hacker-green); }

        /* Preview Window */
        #preview-box {
            position: absolute; top: 55px; left: 0; right: 0; bottom: 0;
            background: white; display: none; z-index: 1000;
        }
        iframe { width: 100%; height: 100%; border: none; }

        .btn-close {
            position: absolute; top: 15px; right: 20px; background: #ff0000;
            color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer; z-index: 1001;
        }

        #loading { display: none; color: var(--cyber-blue); font-size: 12px; margin-bottom: 5px; }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">MS VAULT</div>
        <div class="file-explorer" id="fileList"></div>
        <div style="padding:15px; font-size:10px; border-top:1px solid #222;">
            SERVER: <span style="color:var(--cyber-blue)">ENCRYPTED</span>
        </div>
    </div>

    <div id="main">
        <header>
            <div style="display:flex; align-items:center; gap:10px;">
                <span style="color:var(--hacker-green)">[root@masud]:~#</span>
            </div>
            <div style="font-size:12px; color:var(--cyber-blue)">SYSTEM READY</div>
        </header>

        <div class="editor-container">
            <div id="loading">> INITIALIZING BYPASS... </div>
            <textarea id="promptArea" placeholder="> Type prompt to generate code..."></textarea>
            <button class="btn-execute" onclick="runGeneration()">Execute Protocol</button>
        </div>

        <div id="preview-box">
            <div class="btn-close" onclick="hidePreview()">CLOSE [X]</div>
            <iframe id="outputFrame"></iframe>
        </div>
    </div>

    <script>
        const API_KEY = "sk-eMZ0YbZjMnDJCw8kbfx1jZTVKKSImuqWvoDphfogrLuWPtys";
        const PROXY = "https://corsproxy.io/?";
        const ENDPOINT = "https://api.anthropic.com/v1/messages";
        
        let db = JSON.parse(localStorage.getItem('ms_hacker_db') || '[]');

        function hidePreview() { document.getElementById('preview-box').style.display = 'none'; }

        async function runGeneration() {
            const prompt = document.getElementById('promptArea').value;
            if(!prompt) return alert("Enter Prompt!");

            const loader = document.getElementById('loading');
            const btn = document.querySelector('.btn-execute');
            
            loader.style.display = 'block';
            btn.disabled = true;
            btn.innerText = "GENERATING...";

            try {
                const response = await fetch(PROXY + encodeURIComponent(ENDPOINT), {
                    method: 'POST',
                    headers: {
                        'x-api-key': API_KEY,
                        'anthropic-version': '2023-06-01',
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: "claude-3-5-sonnet-20240620",
                        max_tokens: 4000,
                        system: "You are an elite web developer. Return ONLY valid, complete HTML/CSS/JS code. No prose.",
                        messages: [{ role: "user", content: prompt }]
                    })
                });

                const result = await response.json();
                const code = result.content[0].text;

                // Save Logic
                const newFile = { id: Date.now(), name: `File_${db.length + 1}.html`, content: code };
                db.push(newFile);
                localStorage.setItem('ms_hacker_db', JSON.stringify(db));

                refreshFiles();
                loadPreview(code);

            } catch (err) {
                alert("Protocol Failed. Check Connection/API.");
            } finally {
                loader.style.display = 'none';
                btn.disabled = false;
                btn.innerText = "Execute Protocol";
            }
        }

        function refreshFiles() {
            const list = document.getElementById('fileList');
            list.innerHTML = '';
            db.forEach(file => {
                const div = document.createElement('div');
                div.className = 'file-node';
                div.innerText = `📄 ${file.name}`;
                div.onclick = () => loadPreview(file.content);
                list.prepend(div);
            });
        }

        function loadPreview(code) {
            const frame = document.getElementById('outputFrame');
            const box = document.getElementById('preview-box');
            box.style.display = 'block';
            const blob = new Blob([code], { type: 'text/html' });
            frame.src = URL.createObjectURL(blob);
        }

        window.onload = refreshFiles;
    </script>
</body>
</html>
